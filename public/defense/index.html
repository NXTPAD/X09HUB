T({id:'headers',cat:'Web & network',gl:'⛨',name:'Security Headers Audit',desc:'Grade a site\'s HTTP response headers and get exact fixes for what\'s missing.',render(root,input){
  root.innerHTML=`<div class="stack"><div><label class="lbl" for="sh-in">Response headers. Get them with <code>curl -sI https://yoursite.com</code> or DevTools → Network → a request → Headers.</label><textarea id="sh-in" spellcheck="false"></textarea></div>
    <div class="row"><button class="btn" id="sh-go">Audit headers</button></div><div id="sh-out" class="stack"></div></div>`;
  const inp=$('#sh-in',root),out=$('#sh-out',root);
  function run(){const H={},cookies=[];inp.value.split('\n').forEach(l=>{const m=l.match(/^([\w-]+):\s*(.*)$/);if(!m)return;const k=m[1].toLowerCase();if(k==='set-cookie')cookies.push(m[2]);else H[k]=m[2].trim()});
    if(!Object.keys(H).length&&!cookies.length){out.innerHTML=errHTML('No headers found. Paste lines in the form "name: value".');return}
    const f=[],fix=[];let score=100;const bad=(sev,title,detail,pts,fx)=>{f.push({sev,title,detail});score-=pts;if(fx)fix.push(fx)};const ok=t=>f.push({sev:'ok',title:t});
    const hsts=H['strict-transport-security'];
    if(!hsts)bad('high','Missing Strict-Transport-Security','Browsers can be downgraded to plain http on first visit.',20,'Strict-Transport-Security: max-age=63072000; includeSubDomains; preload');
    else{const ma=+(hsts.match(/max-age=(\d+)/i)||[,0])[1];if(ma<15552000)bad('med',`HSTS max-age is only ${fmtDur(ma)}`,'Use at least 6 months (15552000); 2 years is recommended.',8,'Strict-Transport-Security: max-age=63072000; includeSubDomains; preload');else ok('HSTS enabled with a long max-age');if(!/includesubdomains/i.test(hsts))bad('low','HSTS does not cover subdomains','Add includeSubDomains.',3)}
    const csp=H['content-security-policy'];
    if(!csp)bad('high','Missing Content-Security-Policy','CSP is the main browser defense against cross-site scripting. Build one with the CSP Builder tool.',20,"Content-Security-Policy: default-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'");
    else{if(/'unsafe-inline'/.test(csp)&&!/nonce-|sha(256|384|512)-/.test(csp))bad('med',"CSP allows 'unsafe-inline'",'Inline scripts are allowed, which weakens XSS protection. Use nonces or hashes.',8);if(/'unsafe-eval'/.test(csp))bad('med',"CSP allows 'unsafe-eval'",'eval() and similar become usable by injected code.',6);if(/(script-src|default-src)[^;]*\s\*(\s|;|$)/.test(csp))bad('high','CSP allows scripts from any host (*)','The policy provides little protection.',12);if(f.every(x=>!x.title.startsWith('CSP')))ok('Content-Security-Policy present')}
    if((H['x-content-type-options']||'').toLowerCase()!=='nosniff')bad('med','Missing X-Content-Type-Options: nosniff','Browsers may guess content types and run uploaded files as scripts.',8,'X-Content-Type-Options: nosniff');else ok('MIME sniffing disabled');
    if(!H['x-frame-options']&&!/frame-ancestors/.test(csp||''))bad('med','No clickjacking protection','Add X-Frame-Options or CSP frame-ancestors so other sites cannot frame yours.',10,'X-Frame-Options: DENY');else ok('Clickjacking protection set');
    if(!H['referrer-policy'])bad('low','Missing Referrer-Policy','Full URLs, including tokens in query strings, can leak to other sites.',5,'Referrer-Policy: strict-origin-when-cross-origin');else ok('Referrer-Policy set');
    if(!H['permissions-policy'])bad('low','Missing Permissions-Policy','Restrict camera, microphone and location for your pages and any embeds.',4,'Permissions-Policy: camera=(), microphone=(), geolocation=()');else ok('Permissions-Policy set');
    if(!H['cross-origin-opener-policy'])bad('low','Missing Cross-Origin-Opener-Policy','Isolates your window from pages it opens.',3,'Cross-Origin-Opener-Policy: same-origin');
    if(H.server&&/\d/.test(H.server))bad('low',`Server version exposed: ${H.server}`,'Version numbers help attackers match known exploits. Hide them (nginx: server_tokens off).',4);
    for(const k of['x-powered-by','x-aspnet-version','x-aspnetmvc-version'])if(H[k])bad('low',`${k} exposes ${H[k]}`,'Remove this header.',4);
    if(H['access-control-allow-origin']==='*')bad(/true/i.test(H['access-control-allow-credentials']||'')?'high':'low','CORS allows any origin (*)','Fine for public APIs and assets. For anything behind a login, list allowed origins explicitly.',4);
    cookies.forEach(c=>{const n=c.split('=')[0],miss=[];if(!/;\s*secure/i.test(c))miss.push('Secure');if(!/;\s*httponly/i.test(c))miss.push('HttpOnly');if(!/;\s*samesite/i.test(c))miss.push('SameSite');
      if(miss.length)bad(/sess|auth|token|sid|jwt/i.test(n)&&miss.includes('HttpOnly')?'high':'med',`Cookie "${n}" is missing ${miss.join(', ')}`,'Session cookies need Secure; HttpOnly; SameSite=Lax (or Strict) so scripts cannot read them and they only travel over HTTPS.',/sess|auth|token/i.test(n)?8:3);else ok(`Cookie "${n}" has all security flags`)});
    score=Math.max(0,score);const g=score>=95?'A+':score>=85?'A':score>=72?'B':score>=58?'C':score>=45?'D':'F';const sev={'A+':'ok',A:'ok',B:'med',C:'high',D:'high',F:'crit'}[g];
    out.innerHTML=verdictHTML(g,sev,`Security headers grade ${g}`,`${score}/100 · ${f.filter(x=>x.sev!=='ok').length} issues`)+`<div class="io"><div class="stack"><h3>Findings</h3>${findingsHTML(f)}</div><div class="stack">${fix.length?`<div class="row"><h3 style="margin:0">Headers to add</h3><span style="flex:1"></span><button class="btn ghost sm" id="sh-c">Copy</button></div><pre>${esc(fix.join('\n'))}</pre>
      <h3>Cloudflare Worker snippet</h3><pre id="sh-w">${esc('const res = await fetch(request);\nconst out = new Response(res.body, res);\n'+fix.map(x=>{const i=x.indexOf(':');return`out.headers.set('${x.slice(0,i)}', "${x.slice(i+2)}");`}).join('\n')+"\nout.headers.delete('X-Powered-By');\nreturn out;")}</pre>`:'<p class="muted">Nothing to add.</p>'}</div></div>`;
    const c=$('#sh-c',out);if(c)c.onclick=e=>copy(fix.join('\n'),e.target)}
  $('#sh-go',root).onclick=run;inp.value=input||SAMPLE_HEADERS;run();
}});

T({id:'csp',cat:'Web & network',gl:'⌘',name:'CSP Builder',desc:'Build a Content-Security-Policy directive by directive, with live warnings.',render(root){
  const D=[['default-src',"'self'"],['script-src',"'self'"],['style-src',"'self' https://fonts.googleapis.com"],['img-src',"'self' data:"],['font-src',"'self' https://fonts.gstatic.com"],['connect-src',"'self'"],['frame-src',"'none'"],['object-src',"'none'"],['base-uri',"'self'"],['form-action',"'self'"],['frame-ancestors',"'none'"]];
  root.innerHTML=`<div class="io"><div class="card stack">${D.map(([k,v])=>`<div><label class="lbl" for="cs-${k}">${k}</label><input id="cs-${k}" class="inp" value="${esc(v)}" spellcheck="false"></div>`).join('')}
    <label class="check"><input type="checkbox" id="cs-up" checked> upgrade-insecure-requests</label><div><label class="lbl" for="cs-rep">Report endpoint (report-uri, optional)</label><input id="cs-rep" class="inp" placeholder="https://yoursite.com/csp-report"></div>
    <label class="check"><input type="checkbox" id="cs-ro"> Report-only mode (test without blocking)</label></div>
    <div class="stack"><div class="row"><h3 style="margin:0">HTTP header</h3><span style="flex:1"></span><button class="btn ghost sm" id="cs-c">Copy</button></div><pre id="cs-h"></pre>
    <h3>HTML meta tag</h3><pre id="cs-m"></pre><p class="muted small">Meta tags ignore frame-ancestors, report-uri and report-only. Prefer the header.</p><h3>Warnings</h3><div id="cs-w"></div></div></div>`;
  let head='';
  function run(){const parts=[],w=[];D.forEach(([k])=>{const v=$('#cs-'+k,root).value.trim();if(v)parts.push(k+' '+v);
      if(/script-src|default-src/.test(k)){if(/'unsafe-inline'/.test(v))w.push({sev:'high',title:`${k} allows 'unsafe-inline'`,detail:'Injected inline scripts will run. Use nonces or hashes instead.'});if(/'unsafe-eval'/.test(v))w.push({sev:'med',title:`${k} allows 'unsafe-eval'`});if(/(^|\s)(\*|https?:|data:)(\s|$)/.test(v))w.push({sev:'high',title:`${k} allows a whole scheme or any host`,detail:v})}});
    if(!$('#cs-object-src',root).value.trim())w.push({sev:'med',title:"Set object-src 'none'",detail:'Blocks legacy plugins used for bypasses.'});
    if(!$('#cs-base-uri',root).value.trim())w.push({sev:'med',title:'Set base-uri',detail:'Stops injected <base> tags from rewriting script URLs.'});
    if($('#cs-up',root).checked)parts.push('upgrade-insecure-requests');const rep=$('#cs-rep',root).value.trim();if(rep)parts.push('report-uri '+rep);
    const name=$('#cs-ro',root).checked?'Content-Security-Policy-Report-Only':'Content-Security-Policy';head=`${name}: ${parts.join('; ')}`;
    $('#cs-h',root).textContent=head;$('#cs-m',root).textContent=`<meta http-equiv="Content-Security-Policy" content="${parts.filter(p=>!/^(frame-ancestors|report-uri)/.test(p)).join('; ')}">`;
    $('#cs-w',root).innerHTML=w.length?findingsHTML(w):findingsHTML([{sev:'ok',title:'Policy looks tight'}])}
  $$('input',root).forEach(i=>i.addEventListener('input',run));$('#cs-c',root).onclick=e=>copy(head,e.target);run();
}});

T({id:'subnet',cat:'Web & network',gl:'⌗',name:'Subnet Calculator',desc:'CIDR ranges, masks, host counts, IP scope, and whether an address is in range.',render(root,input){
  root.innerHTML=`<div class="io"><div class="stack card"><div><label class="lbl" for="sn-in">IPv4 with prefix or mask</label><input id="sn-in" class="inp" spellcheck="false"></div>
    <div><label class="lbl" for="sn-t">Is this address inside the range?</label><input id="sn-t" class="inp" placeholder="10.20.6.200" spellcheck="false"></div><div id="sn-tr"></div></div><div id="sn-out" class="stack"></div></div>`;
  const inp=$('#sn-in',root);let cur=null;
  function run(){try{const r=subnet(inp.value);cur=r;$('#sn-out',root).innerHTML=`<div class="card">${kvHTML({'Network':`<b>${r.network}/${r.prefix}</b>`,'Subnet mask':r.mask,'Wildcard (ACL)':r.wildcard,'First usable':r.first,'Last usable':r.last,'Broadcast':r.broadcast,'Usable hosts':r.hosts.toLocaleString('en-US'),'Total addresses':r.size.toLocaleString('en-US'),'Class':r.cls,'Scope':`<span class="${r.scope==='Public'?'s-med':'s-ok'}">${r.scope}</span>`})}</div><div><h3>Binary</h3><pre>IP    ${r.bin[0]}\nMask  ${r.bin[1]}</pre></div>`;test()}
    catch(e){cur=null;$('#sn-out',root).innerHTML=errHTML(e.message);$('#sn-tr',root).innerHTML=''}}
  function test(){const v=$('#sn-t',root).value.trim(),o=$('#sn-tr',root);if(!v||!cur){o.innerHTML='';return}const n=ipToInt(v);if(n===null){o.innerHTML=errHTML('Not a valid IPv4 address.');return}
    o.innerHTML=n>=cur.netInt&&n<=cur.bcInt?`<div class="banner s-ok">${esc(v)} is inside ${cur.network}/${cur.prefix}</div>`:`<div class="banner s-med">${esc(v)} is outside ${cur.network}/${cur.prefix}</div>`}
  inp.oninput=run;$('#sn-t',root).oninput=test;inp.value=input||'10.20.4.17/22';$('#sn-t',root).value='10.20.6.200';run();
}});

const PORTS=[[20,'TCP','FTP data','high','Cleartext file transfer. Replace with SFTP.'],[21,'TCP','FTP','high','Credentials sent in cleartext. Replace with SFTP or FTPS.'],[22,'TCP','SSH','med','Key-only auth, no root login, fail2ban or an allowlist.'],[23,'TCP','Telnet','crit','Cleartext remote shell. Disable it and use SSH.'],[25,'TCP','SMTP','med','Make sure it is not an open relay; require STARTTLS.'],[53,'TCP/UDP','DNS','med','Open resolvers are abused for amplification DDoS. Restrict recursion.'],[69,'UDP','TFTP','high','No authentication. Never expose to the internet.'],[80,'TCP','HTTP','low','Redirect everything to HTTPS.'],[110,'TCP','POP3','high','Cleartext mail login. Use POP3S (995).'],[111,'TCP/UDP','RPCbind','high','Leaks service info and is used in amplification. Block externally.'],[123,'UDP','NTP','med','Disable monlist; amplification risk.'],[135,'TCP','MS-RPC','high','Windows RPC. Never expose to the internet.'],[137,'UDP','NetBIOS','high','Leaks host and user info. Block at the edge.'],[139,'TCP','NetBIOS session','high','Legacy file sharing. Block at the edge.'],[143,'TCP','IMAP','high','Cleartext mail login. Use IMAPS (993).'],[161,'UDP','SNMP','high','Default "public" community strings leak config. Use SNMPv3.'],[389,'TCP/UDP','LDAP','high','Directory data and binds in cleartext. Use LDAPS and keep internal.'],[443,'TCP','HTTPS','low','Keep TLS 1.2+ only and check your headers.'],[445,'TCP','SMB','crit','Ransomware spreads through SMB (EternalBlue, WannaCry). Never expose.'],[465,'TCP','SMTPS','low','Encrypted mail submission.'],[587,'TCP','SMTP submission','low','Require auth and STARTTLS.'],[636,'TCP','LDAPS','med','Encrypted, but keep directory services internal.'],[873,'TCP','rsync','high','Often configured without auth. Restrict.'],[993,'TCP','IMAPS','low','Encrypted mail.'],[995,'TCP','POP3S','low','Encrypted mail.'],[1433,'TCP','Microsoft SQL Server','crit','Databases should never face the internet. Use a VPN or private network.'],[1521,'TCP','Oracle DB','crit','Keep internal.'],[1900,'UDP','SSDP / UPnP','med','Amplification and device discovery. Block at the edge.'],[2049,'TCP','NFS','high','File shares with weak auth. Keep internal.'],[2375,'TCP','Docker API (no TLS)','crit','Unauthenticated root on the host. Never expose; use 2376 with TLS or the socket.'],[3306,'TCP','MySQL / MariaDB','crit','Keep internal; bind to localhost or a private network.'],[3389,'TCP','RDP','crit','Top ransomware entry point. Put behind a VPN or gateway with MFA.'],[5432,'TCP','PostgreSQL','crit','Keep internal.'],[5900,'TCP','VNC','crit','Often weak or no password. Tunnel through SSH or a VPN.'],[5985,'TCP','WinRM (HTTP)','high','Remote PowerShell. Restrict to admin networks.'],[5986,'TCP','WinRM (HTTPS)','high','Restrict to admin networks.'],[6379,'TCP','Redis','crit','No auth by default; attackers write SSH keys through it. Bind to localhost.'],[8080,'TCP','HTTP alternate','med','Often dev servers or admin panels left exposed.'],[8443,'TCP','HTTPS alternate','med','Often admin consoles. Restrict access.'],[9200,'TCP','Elasticsearch','crit','Frequent source of mass data leaks. Enable auth, keep internal.'],[11211,'TCP/UDP','Memcached','crit','Record-setting DDoS amplification. Never expose.'],[27017,'TCP','MongoDB','crit','Frequent source of mass data leaks. Enable auth, keep internal.']];
T({id:'ports',cat:'Web & network',gl:'⊞',name:'Port Risk Reference',desc:'What each common port is, how attackers abuse it, and how to lock it down.',render(root){
  root.innerHTML=`<div class="stack"><div class="row"><input id="pt-q" class="inp grow" placeholder="Filter by port or service, e.g. 3389 or database" spellcheck="false"><select id="pt-r" style="width:auto"><option value="">All risk levels</option><option value="crit">Critical only</option><option value="high">High and above</option></select></div>
    <div class="tbl-wrap"><table><thead><tr><th>Port</th><th>Service</th><th>Risk if public</th><th>Hardening</th></tr></thead><tbody id="pt-b"></tbody></table></div></div>`;
  function run(){const q=$('#pt-q',root).value.toLowerCase().trim(),r=$('#pt-r',root).value;
    const rows=PORTS.filter(p=>(!q||String(p[0]).startsWith(q)||(p[2]+' '+p[4]).toLowerCase().includes(q)||(q==='database'&&/sql|db|mongo|redis|elastic|postgres/i.test(p[2])))&&(!r||(r==='crit'?p[3]==='crit':['crit','high'].includes(p[3]))));
    $('#pt-b',root).innerHTML=rows.map(p=>`<tr><td><b>${p[0]}</b><br><span class="muted small">${p[1]}</span></td><td>${p[2]}</td><td><span class="sev s-${p[3]}">${SEV_LABEL[p[3]]}</span></td><td class="muted">${p[4]}</td></tr>`).join('')||'<tr><td colspan="4" class="muted">No matching ports.</td></tr>'}
  $('#pt-q',root).oninput=run;$('#pt-r',root).onchange=run;run();
}});

/* RESPONSE */
const PLAYBOOK=[['Prepare',['Incident contacts (IT, leadership, legal, insurer) are current and reachable','Logs are centralized and kept at least 90 days','Offline backups were restore-tested in the last 90 days']],
 ['Detect & analyze',['Record when it was first seen, who reported it, and how','Identify affected systems, accounts and data','Preserve evidence before changing anything: memory, disk images, logs','Rate severity and decide who must be told now','Start a timeline of every action taken, with times']],
 ['Contain',['Isolate affected hosts from the network (do not power them off)','Disable or reset compromised accounts and revoke active sessions','Block malicious IPs, domains and file hashes at firewall, EDR and email gateway','Rotate exposed passwords, API keys and tokens']],
 ['Eradicate',['Remove malware and persistence: scheduled tasks, services, run keys, cron jobs, new admin users','Patch the vulnerability that let the attacker in','Rebuild compromised systems from known-good images']],
 ['Recover',['Restore data from clean backups and verify integrity','Return systems to production with the owner\'s sign-off','Watch restored systems closely for 30 days']],
 ['Learn',['Hold a lessons-learned review within two weeks','Check notification duties: regulators, customers, insurer, law enforcement','Add detections for what was missed and update this playbook']]];
T({id:'ir',cat:'Incident response',gl:'⚠',name:'Incident Playbook',desc:'Work an incident step by step (NIST SP 800-61 phases) and export a status report.',render(root){
  const st=store('ir')||{name:'Phishing: finance credential theft',sev:'High',lead:'',done:{}};
  root.innerHTML=`<div class="io"><div class="stack"><div class="card stack"><div><label class="lbl" for="ir-n">Incident</label><input id="ir-n" class="inp"></div>
    <div class="row"><div class="grow"><label class="lbl" for="ir-s">Severity</label><select id="ir-s">${['Critical','High','Medium','Low'].map(s=>`<option>${s}</option>`).join('')}</select></div><div class="grow"><label class="lbl" for="ir-l">Incident lead</label><input id="ir-l" class="inp" placeholder="Name"></div></div>
    <div><div class="row" style="justify-content:space-between"><span class="lbl" style="margin:0">Progress</span><span class="small" id="ir-p"></span></div><div class="bar" style="margin-top:6px"><i id="ir-b"></i></div></div></div>
    ${PLAYBOOK.map(([ph,items],pi)=>`<div class="pb-phase"><h3>${pi+1} · ${ph}</h3>${items.map((it,ii)=>`<label class="pb-item" for="ir-${pi}-${ii}"><input type="checkbox" id="ir-${pi}-${ii}" data-k="${pi}-${ii}"><span>${esc(it)}</span></label>`).join('')}</div>`).join('')}
    <div class="row"><button class="btn ghost sm" id="ir-reset">Reset checklist</button><span class="muted small" id="ir-rc"></span></div></div>
    <div class="stack"><div class="row"><h3 style="margin:0">Status report</h3><span style="flex:1"></span><button class="btn ghost sm" id="ir-c">Copy report</button></div><pre id="ir-rep" style="max-height:none"></pre></div></div>`;
  $('#ir-n',root).value=st.name;$('#ir-s',root).value=st.sev;$('#ir-l',root).value=st.lead;
  $$('[data-k]',root).forEach(c=>{c.checked=!!st.done[c.dataset.k];c.closest('.pb-item').classList.toggle('done',c.checked)});
  function run(){st.name=$('#ir-n',root).value;st.sev=$('#ir-s',root).value;st.lead=$('#ir-l',root).value;st.done={};
    $$('[data-k]',root).forEach(c=>{if(c.checked)st.done[c.dataset.k]=1;c.closest('.pb-item').classList.toggle('done',c.checked)});store('ir',st);
    const total=PLAYBOOK.reduce((a,p)=>a+p[1].length,0),n=Object.keys(st.done).length;$('#ir-p',root).textContent=`${n} of ${total} steps`;$('#ir-b',root).style.width=(n/total*100)+'%';
    const phase=PLAYBOOK.find((p,pi)=>p[1].some((_,ii)=>!st.done[pi+'-'+ii]));
    $('#ir-rep',root).textContent=`INCIDENT STATUS REPORT\n${'='.repeat(22)}\nIncident: ${st.name||'(unnamed)'}\nSeverity: ${st.sev}\nLead:     ${st.lead||'(unassigned)'}\nUpdated:  ${new Date().toLocaleString()}\nPhase:    ${phase?phase[0]:'Closed'} (${n}/${total} steps done)\n\n`+
      PLAYBOOK.map(([ph,items],pi)=>`${ph.toUpperCase()}\n`+items.map((it,ii)=>`  [${st.done[pi+'-'+ii]?'x':' '}] ${it}`).join('\n')).join('\n\n')}
  $$('input,select',root).forEach(x=>x.addEventListener('input',run));
  let arm=false;$('#ir-reset',root).onclick=e=>{if(!arm){arm=true;e.target.textContent='Click again to clear all';$('#ir-rc',root).textContent='';setTimeout(()=>{arm=false;e.target.textContent='Reset checklist'},3000);return}
    $$('[data-k]',root).forEach(c=>c.checked=false);arm=false;e.target.textContent='Reset checklist';$('#ir-rc',root).textContent='Checklist cleared.';run()};
  $('#ir-c',root).onclick=e=>copy($('#ir-rep',root).textContent,e.target);run();
}});

const nav=$('#nav'),view=$('#view'),rail=$('#rail'),scrim=$('#scrim');let current=null;
function drawNav(filter=''){const f=filter.toLowerCase();const cats=[...new Set(TOOLS.map(t=>t.cat))];
  nav.innerHTML=cats.map(c=>{const items=TOOLS.filter(t=>t.cat===c&&(!f||(t.name+' '+t.desc+' '+t.id).toLowerCase().includes(f)));return items.length?`<div class="grp"><h4>${c}</h4>${items.map(t=>`<a class="nav-a" href="#${t.id}" data-id="${t.id}"${t.id===current?' aria-current="page"':''}><span class="gl">${t.gl}</span>${t.name}</a>`).join('')}</div>`:''}).join('')||'<p class="muted small" style="padding:0 10px">No tool matches.</p>'}
function go(id,input){const t=TOOLS.find(x=>x.id===id)||TOOLS[0];if(cleanup){cleanup();cleanup=null}current=t.id;
  view.innerHTML=`<header class="vhead"><p class="kicker">${t.id==='console'?'whoami':t.cat.toLowerCase().replace(/ & | /g,'-')}</p><h1>${t.name}</h1><p class="lede">${t.desc}</p></header><div id="tool"></div>`;
  try{t.render($('#tool'),input)}catch(e){$('#tool').innerHTML=errHTML('This tool failed to load: '+e.message)}
  $('#cmd').textContent=t.id==='console'?'console':'run '+t.id;drawNav($('#q').value);closeRail();
  if(location.hash.slice(1)!==t.id){try{history.replaceState(null,'','#'+t.id)}catch{location.hash=t.id}}window.scrollTo(0,0)}
function openRail(){rail.classList.add('open');scrim.hidden=false}function closeRail(){rail.classList.remove('open');scrim.hidden=true}
$('#menu').onclick=openRail;scrim.onclick=closeRail;
nav.addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(a){e.preventDefault();go(a.dataset.id)}});
view.addEventListener('click',e=>{const a=e.target.closest('a.tool-card');if(a){e.preventDefault();go(a.getAttribute('href').slice(1))}});
$('.brand').onclick=e=>{e.preventDefault();go('console')};
$('#q').oninput=e=>drawNav(e.target.value);
$('#q').onkeydown=e=>{if(e.key==='Enter'){const a=$('.nav-a',nav);if(a)go(a.dataset.id)}};
document.addEventListener('keydown',e=>{if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openRail();$('#q').focus()}if(e.key==='Escape')closeRail()});
addEventListener('hashchange',()=>{const id=location.hash.slice(1);if(id&&id!==current)go(id)});
go(location.hash.slice(1)||'console');

swB.onclick=e=>{e.stopPropagation();const o=swM.hidden;swM.hidden=!o;swB.setAttribute('aria-expanded',o)};

$('.x09-switch-item.here').onclick=e=>{e.preventDefault();swM.hidden=true;go('console')};
